name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q -f snip2md.py ui.py layout.py ocr_local.py providers.py
