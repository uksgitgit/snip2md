[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snip2md"
version = "0.1.0"
description = "Snip a screen region and get GitHub-flavored Markdown on the clipboard."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["ocr", "markdown", "screenshot", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
  "pillow>=10",
  "pyperclip>=1.8",
  "claude-agent-sdk==0.2.144",
  "cursor-sdk==1.0.28",
  "winocr>=0.0.15",
  "rapidocr>=3.0.0",
  "onnxruntime>=1.17.0",
]

[project.gui-scripts]
snip2md = "snip2md:main"

[project.urls]
Homepage = "https://github.com/uksgitgit/snip2md"
Issues = "https://github.com/uksgitgit/snip2md/issues"

[tool.setuptools]
py-modules = ["snip2md", "ui", "layout", "ocr_local", "providers"]
